name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://booking:booking@localhost:5432/booking_test
      TEST_DATABASE_URL: postgresql+psycopg://booking:booking@localhost:5432/booking_test
      FLASK_APP: wsgi.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
      - name: Migraciones (upgrade → downgrade → upgrade)
        run: flask db upgrade && flask db downgrade base && flask db upgrade

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Levantar el stack completo
        run: docker compose up -d --build --wait
      - name: Smoke test a través de nginx
        run: |
          curl -fsS http://localhost:8080/api/health
          # Sin token → 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/rooms)" = 401
          # Login con el usuario de demo y listado de salas
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ana@demo.local","password":"demo1234"}' | jq -r .access_token)
          curl -fsS http://localhost:8080/api/rooms -H "Authorization: Bearer $TOKEN" | grep -q Atl
          # El EXCLUDE existe en la base de datos creada por las migraciones
          docker compose exec -T db psql -U booking -c '\d bookings' | grep -q ex_bookings_no_overlap
          # Enrutado de la SPA a través de Nginx
          curl -fsS http://localhost:8080/admin/stats | grep -q '<div id="root">'
      - name: Logs si falla
        if: failure()
        run: docker compose logs
